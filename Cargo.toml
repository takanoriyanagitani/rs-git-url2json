[package]
name = "rs-git-url2json"
version = "0.1.0"
edition = "2024"

exclude = [
]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"

[profile.release-wasi]
inherits = "release"
lto = true
strip = true
opt-level = 's'
codegen-units = 1

[[bin]]
name = "git-url2json"

[dependencies.serde_json]
version = "1.0.154"
default-features = false
features = [
  "std",
]

[dependencies.serde]
version = "1.0.229"
default-features = false
features = [
  "std",
  "derive",
]

[dependencies.git-url-parse]
version = "0.6.0"
default-features = false
features = [
  "serde",
  "url",
]
