[package]
name = "rs-git-url2json"
version = "0.1.0"
edition = "2024"

description = "Convert Git URLs to JSONs"
license = "Apache-2.0"
repository = "https://github.com/takanoriyanagitani/rs-git-url2json"
homepage = "https://github.com/takanoriyanagitani/rs-git-url2json"
documentation = "https://docs.rs/rs-git-url2json/latest"
keywords = ["git", "url", "json", "convert", "wasi"]

exclude = [
  "git-url2json.wasm",
]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"

[profile.release-wasi]
inherits = "release"
lto = true
strip = true
opt-level = 's'
codegen-units = 1

[[bin]]
name = "git-url2json"

[dependencies.serde_json]
version = "1.0.154"
default-features = false
features = [
  "std",
]

[dependencies.serde]
version = "1.0.229"
default-features = false
features = [
  "std",
  "derive",
]

[dependencies.git-url-parse]
version = "0.6.0"
default-features = false
features = [
  "serde",
  "url",
]
